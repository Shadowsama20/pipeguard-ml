[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeguard-ml"
version = "0.1.0"
description = "An AST linter for preprocessing data leakage in ML workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
pipeguard = "pipeguard.cli:main"

[tool.setuptools]
packages = ["pipeguard"]

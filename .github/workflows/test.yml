name: Python compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: CPython ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.16-dev"]
    continue-on-error: ${{ matrix.python == '3.16-dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          cd "$RUNNER_TEMP"
          python -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m unittest discover -v -s "$GITHUB_WORKSPACE/tests"
          pipeguard --help
